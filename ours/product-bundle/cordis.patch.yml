# @ours/product-bundle — product layer applied after dsh-base and dsh-web-app.
# Rows are turned off, never removed, so later layers can re-enable one by id.
# Source of the list: handoff/harness.md section f, re-checked against tag dsh-v0.2.2-rc.1.

# ── DeepSeek service uploads and API extensions (base) ──────────────────────
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true

# ── Feedback-triggered OTel upload of session logs (base) ───────────────────
# Also launch with DSH_TELEMETRY_DISABLED=1 (base patch comment above `otel`).
- id: session-telemetry-otel
  disabled: true
- id: otel
  disabled: true

# ── Message feedback, the input that triggers the upload (web-app) ──────────
- id: message-feedback
  disabled: true
- id: ui-message-feedback
  disabled: true

# ── Product analytics: already off outside desktop, pinned off here ─────────
- id: product-analytics
  disabled: true
- id: desktop-product-telemetry
  disabled: true

# ── DeepSeek account sign-in ────────────────────────────────────────────────
- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: account-controller
  disabled: true
- id: ui-settings-account
  disabled: true

# ── DeepSeek model adapter and DeepSeek web search ──────────────────────────
# Models come from llm-pi-ai routes (llm-pi-ai stays on).
- id: llm-deepseek
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
# web-fetch-http waits for the `web` service and stays pending without this.
- id: web-fetch-http
  disabled: true
# The shipped presets (standard, ptc, cordis) still list tool-web; @ours/presets
# replaces them with presets that leave it out.

# ── Harness development context and plugin management UI ───────────────────
# plugin-manager (service, base) stays on: our own installer calls it.
- id: harness-dev-context
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: entry-customization
  disabled: true

# ── Brand (replaced by @ours/brand later) ───────────────────────────────────
- id: ui-brand-official
  disabled: true

# ── Launch URL handling ─────────────────────────────────────────────────────
# Kept as shipped for development (printUrl true). Production sets
# printUrl: false and openBrowser: false; the whole config must be restated:
# - id: web-runtime
#   inject: [webStartup]
#   config:
#     openBrowser: false
#     printUrl: false
#     publicUrl: !!js ctx.webStartup.publicUrl
#     surfaceContext: true

# ── Skills: only roots the product configures ───────────────────────────────
# Default roots include the host user's ~/.agents/skills and the project's
# .agents/skills; a dev run showed the host user's own skills in the model
# context. Product skill directories go in customSkillDirs.
- id: skill-filesystem
  config:
    includeDefaultRoots: false

# ── Agent presets ───────────────────────────────────────────────────────────
# With `web` off, a shipped preset that lists tool-web cannot create a session
# ("agent-preset/invalid: tool-web … waiting for web"). The shipped presets are
# turned off and a draft `analyst` preset becomes the default. @ours/presets
# will own this section later.
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: agent-preset-registry
  config:
    default: analyst
- insert:
    - id: preset-analyst
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: analyst
        name: Analyst
        description: Answers business questions from company data. No shell, web, or plugin tools.
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a data analyst agent powered by the {{model}} model.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
