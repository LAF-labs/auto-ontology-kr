# @ours/product-bundle — product layer applied after dsh-base and dsh-web-app.
# Rows are turned off, never removed, so later layers can re-enable one by id.
# Source of the list: handoff/harness.md section f, re-checked against tag dsh-v0.2.2-rc.1.

# ── DeepSeek service uploads and API extensions (base) ──────────────────────
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true

# ── Feedback-triggered OTel upload of session logs (base) ───────────────────
# Also launch with DSH_TELEMETRY_DISABLED=1 (base patch comment above `otel`).
- id: session-telemetry-otel
  disabled: true
- id: otel
  disabled: true

# ── Message feedback, the input that triggers the upload (web-app) ──────────
- id: message-feedback
  disabled: true
- id: ui-message-feedback
  disabled: true

# ── Product analytics: already off outside desktop, pinned off here ─────────
- id: product-analytics
  disabled: true
- id: desktop-product-telemetry
  disabled: true

# ── DeepSeek account sign-in ────────────────────────────────────────────────
- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: account-controller
  disabled: true
- id: ui-settings-account
  disabled: true

# ── DeepSeek model adapter and DeepSeek web search ──────────────────────────
# Models come from llm-pi-ai routes (llm-pi-ai stays on).
- id: llm-deepseek
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
# web-fetch-http waits for the `web` service and stays pending without this.
- id: web-fetch-http
  disabled: true
# The shipped presets still list tool-web and fail to create a session with
# `web` off; @ours/presets turns them off and supplies its own.

# ── Harness development context and plugin management UI ───────────────────
# plugin-manager (service, base) stays on: our own installer calls it.
- id: harness-dev-context
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: entry-customization
  disabled: true

# ── Host-directory tool ─────────────────────────────────────────────────────
# A base row registers working_directory for every agent; it lets the model
# move the session directory to any existing host path. Product presets read
# data only through Auto-ontology.
- id: tool-working-directory
  disabled: true

# ── Brand (replaced by @ours/brand later) ───────────────────────────────────
- id: ui-brand-official
  disabled: true

# ── Request guard ───────────────────────────────────────────────────────────
# Same-origin page JS runs as the owner and can call any /api Remote. Refuse
# the plugin manager's Remote over HTTP; our own installer calls the service
# in-process. All pluginManager Remotes are unary HTTP calls (no stream), so
# this covers them. It also blocks the shipped Plugins page, turned off above.
- insert:
    - id: request-guard
      name: '@ours/product-bundle/request-guard'
      config:
        denyPathPrefixes:
          - /api/pluginManager/

# ── Launch URL handling ─────────────────────────────────────────────────────
# Kept as shipped for development (printUrl true). Production sets
# printUrl: false and openBrowser: false; the whole config must be restated:
# - id: web-runtime
#   inject: [webStartup]
#   config:
#     openBrowser: false
#     printUrl: false
#     publicUrl: !!js ctx.webStartup.publicUrl
#     surfaceContext: true

# ── Skills: only roots the product configures ───────────────────────────────
# Default roots include the host user's ~/.agents/skills and the project's
# .agents/skills, which would put the host user's own skills in the session
# catalog. Product skill directories go in customSkillDirs.
- id: skill-filesystem
  config:
    includeDefaultRoots: false

# ── Composer: no host files, permission switching, model switching, export ──
# Hiding a selector is presentation only: the host Remotes behind it stay.
# `permission` (presets + /permission) is turned off with its client; the
# sandbox and approval rows keep their composed defaults. `ui-file-drag`
# stays: ui-chat waits for its fileDrag service.
- id: ui-attachment
  disabled: true
- id: permission
  disabled: true
- id: ui-permission
  disabled: true
- id: ui-model-selection
  disabled: true
- id: session-log-download
  disabled: true
- id: command-feedback
  disabled: true

# ── Model context: no host file policy ──────────────────────────────────────
# The analyst presets mount no file tools, so the sandbox and approval
# sentences describe nothing the model can use. `working-directory:current`
# is a required context and cannot be removed from a bundle.
- insert:
    - id: context-filter
      name: '@ours/product-bundle/context-filter'
      config:
        dropContexts: [sandbox:policy, approval:policy]

# ── Default workspace under DSH_HOME, not the host Documents folder ─────────
# Applies when the default workspace is first created; an existing default is
# never moved.
- id: workspace-controller
  config:
    documentsDirectory: !!js dshHomePath('workspaces')
