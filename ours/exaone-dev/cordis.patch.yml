# EXAONE development route. Overlay only: `dsh web --patch ours/exaone-dev/cordis.patch.yml`.
# The key never appears here; launch with EXAONE_API_KEY exported from secrets/exaone.key.
# Terms allow non-commercial development use only; never ship this in a customer stack.
- id: llm-pi-ai
  config:
    providers:
      exaone:
        displayName: EXAONE (dev)
        apiKeyEnv: EXAONE_API_KEY
        api: openai-completions
        baseURL: https://api.exaone.ai/v1
        compat:
          supportsDeveloperRole: false
          supportsStore: false
          maxTokensField: max_tokens
          thinkingFormat: openai
        retryPolicy:
          mode: normal
          maxRetries: 5
        models:
          - id: k-exaone_v2.5
            name: K-EXAONE 2.5
            contextWindow: 524288
            maxTokens: 32768
            reasoningEfforts:
              low: low
              high: high
              max: max
