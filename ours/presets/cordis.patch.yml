# @ours/presets — product agent presets. Requires @ours/ao-connector and
# @ours/dashboard in the profile.
#
# No preset here mounts a tool that runs on the harness host or reads its files:
# no bash/pwsh, no tool-fs (read included: the sandbox does not limit reads, so
# $DSH_HOME/.credentials.yaml would be readable), no tool-fs-search, no
# filesystem skills, no web, no subagents, no plugin tools. Data comes only
# through Auto-ontology. The editor mounts the skill tool for its one skill,
# embedded in @ours/dashboard; its Sessions run in an empty directory.

# The shipped presets list tools whose services the product turns off
# (tool-web waits for `web`), so they are turned off rather than edited.
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true

- id: agent-preset-registry
  config:
    default: analyst

- insert:
    - id: preset-analyst
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: analyst
        name: Analyst
        description: Answers business questions from company data through Auto-ontology.
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a data analyst for this company, powered by the {{model}} model.
                Answer business questions from company data. Prefer a verified saved
                analysis; when you ask a new question, show the generated SQL and say
                the number is unreviewed. Never estimate a number you did not read
                from a result. Write every reply in the language of the person's latest
                message, including notes after tool calls; keep ids, column names and SQL
                as they are.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: ao-tools
            name: '@ours/ao-connector/tools'
            config:
              tools: [ao_list_analyses, ao_get_analysis, ao_run_analysis, ao_search_terms, ao_question_coverage, ao_ask_question]
              maxRows: 200
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # Opened only by the dashboard edit button (@ours/dashboard), which binds
    # the new Session to one browser's draft. The editing tools refuse any
    # Session without that binding, so choosing this preset elsewhere edits
    # nothing. There is no publish tool and no question tool (ao_ask_question):
    # data comes from saved analyses, and a person publishes.
    - id: preset-dashboard-editor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dashboard-editor
        name: Dashboard editor
        description: Edits a dashboard draft from saved analyses. Opened from a dashboard.
        order: 90
        # Not offered in the new-session picker or as the default (harness/PATCHES.md).
        hidden: true
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You edit one company dashboard draft with the person beside you, powered by
                the {{model}} model. They see the draft preview next to this conversation
                and are the only one who can publish it. Start by reading the draft
                (dashboard_read_draft), and read it again before each change. Every widget
                shows a saved analysis by id; never put SQL in the dashboard. Prefer an
                existing verified analysis (ao_list_analyses, ao_get_analysis) and run it to
                see its columns before binding it. When none fits, save a draft analysis
                (dashboard_save_analysis) and tell the person it needs their verification in
                the panel before the dashboard can be published. When no widget type fits,
                load the dashboard-widget-authoring skill, then save a new type. Never state
                a number you did not read from a result. Say what you changed in one or two
                sentences. Write every reply in the language of the person's latest
                message, including notes after tool calls; keep ids, column names and SQL
                as they are.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: ao-tools
            name: '@ours/ao-connector/tools'
            config:
              tools: [ao_list_analyses, ao_get_analysis, ao_run_analysis, ao_search_terms, ao_question_coverage]
              maxRows: 10
          - id: dashboard-editor-tools
            name: '@ours/dashboard/editor-tools'
            config:
              maxRows: 10
          - id: dashboard-widget-skill
            name: '@ours/dashboard/widget-skill'
          # Preset agents see only the tools their preset mounts, so the skill
          # tool is mounted here. Its catalog is this preset's skill plus any
          # found from the editor's directory, which holds none.
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
