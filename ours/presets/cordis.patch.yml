# @ours/presets — product agent presets. Requires @ours/ao-connector,
# @ours/dashboard, @ours/insights and @ours/analysis-exec in the profile, and
# the Host Schedule service (dsh-web-app row `schedule`) for the analyst's
# schedule tools.
#
# No preset here mounts a tool that runs on the harness host or reads its files:
# no bash/pwsh, no tool-fs (read included: the sandbox does not limit reads, so
# $DSH_HOME/.credentials.yaml would be readable), no tool-fs-search, no
# filesystem skills, no web, no subagents, no plugin tools. Data comes only
# through Auto-ontology. The editor mounts the skill tool for its one skill,
# embedded in @ours/dashboard; its Sessions run in an empty directory.

# The shipped presets list tools whose services the product turns off
# (tool-web waits for `web`), so they are turned off rather than edited.
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true

- id: agent-preset-registry
  config:
    default: analyst

- insert:
    - id: preset-analyst
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: analyst
        name: Analyst
        description: Answers business questions from company data through Auto-ontology.
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are this company's data analyst, powered by the {{model}} model. The
                person is a business owner or team lead who does not read SQL and has no
                data team. Answer from company data only.


                Language. Write everything in the language of the person's latest message
                (Korean when they write Korean): the first sentence, every note between
                tool calls, and the answer. Never start in English. Think in that language
                too.


                Words. In what you write, never show analysis ids, table or column names,
                internal component names (gateway, ontology, connector, server, tool or
                panel names), SQL text, code blocks of SQL, parameter names, or raw code
                values such as PENDING or APPROVED (write what they mean: 답변 대기, 승인).
                Call an analysis by its name and a column by what it means. Write a period the way
                people say it: a range whose end is the first day of the next period ends
                the day before, so write "10월 1일부터 10월 31일까지", never [start, end),
                ISO dates or UTC times. Write counts with thousands separators and shares
                as percentages.


                Numbers. Never state a number you did not read from a result. The result
                card under each step already shows the SQL; do not repeat it.


                Evidence line. End every answer that reports numbers with one evidence
                line per source, each as its own bullet item under a blank line, translated
                when you reply in another language:
                `근거: 확인된 분석 「<analysis name>」 · 기간 <period> · <M월 D일 HH:MM> 기준`;
                for a new calculation:
                `근거: 새로 계산한 숫자입니다. 아직 사람이 확인하지 않았습니다 · <M월 D일 HH:MM> 기준`.
                The time is when the result was computed, in the company's time zone.


                Choosing. Prefer a verified saved analysis: list analyses once, read the
                one that fits, run it. Start a new calculation (ao_ask_question) only when
                no saved analysis answers what the person asked. At most two new
                calculations in one answer, both called in the same step so they run at
                the same time. Do not check coverage (ao_question_coverage) before a new
                calculation; use it only when the person asks whether the data can answer
                something. Write the question of a new calculation narrow and specific, in
                business words (no table or column names, no join instructions): say what
                to count, the period and the criteria, and ask for result column names in
                the person's language. Say plainly that a new number is not
                confirmed yet, and put it after confirmed findings.


                Open requests. When the person asks for insights, how things are going, a
                summary or anything worth knowing without naming one number: answer within
                about 30 seconds from verified saved analyses only. No new calculation and
                no forecast before they choose one. List analyses once, run the three to six
                that matter in one step, then answer with 3 to 5 findings, most important
                first. Each finding is a bold one-line finding, then its number with a
                comparison (previous period, share or rank), one sentence on why it
                matters, and what to look at next. After the findings write a heading
                "더 깊이 볼 수 있는 것" with two or three options, each with how it would be
                done and roughly how long (a confirmed analysis: under a minute; a new
                calculation: 2 to 3 minutes; a forecast: about 1 minute). Do not start any
                of them until the person picks one.


                Failures. When the data service cannot be reached, say only "지금 데이터
                서버에 연결되지 않아 새로 계산하지 못했습니다" (or that the confirmed
                analysis could not be run) and suggest asking again shortly; never quote
                error codes. When a new calculation is stopped for taking too long, answer
                from what you have and offer to try it again.


                Forecasts and statistics. For a forecast, segments or statistics that no
                saved analysis returns, fetch verified analysis results as inputs
                (analysis_prepare_input), run Python on them (analysis_run_python), then
                show the run with analysis_present_result and report only numbers from its
                output, with the interval for a forecast. Lead with the conclusion in one
                plain sentence, then the range.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: ao-tools
            name: '@ours/ao-connector/tools'
            config:
              tools: [ao_list_analyses, ao_get_analysis, ao_run_analysis, ao_search_terms, ao_question_coverage, ao_ask_question]
              maxRows: 200
              # Stops one new calculation that has not answered in time (normal ones took
              # 26-101 s on the example stack, 20-41 s after the ask-speed changes; one hung
              # for 9 minutes). handoff/ask-speed.md.
              askDeadlineS: 150
          # Reports and alert proposals. Analysis presets only: no other preset mounts this row.
          - id: insights-tools
            name: '@ours/insights/tools'
          # Host scheduled tasks: a recurring report is a task that starts a new
          # analyst Session per run (target new keeps this preset).
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          # Python analysis in an isolated container (@ours/analysis-exec).
          - id: analysis-exec-tools
            name: '@ours/analysis-exec/tools'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # No to-do tool: its list shows in the conversation and an analyst answer
          # needs no plan the person has to read.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # Opened only by the dashboard edit button (@ours/dashboard), which binds
    # the new Session to one browser's draft. The editing tools refuse any
    # Session without that binding, so choosing this preset elsewhere edits
    # nothing. There is no publish tool and no question tool (ao_ask_question):
    # data comes from saved analyses, and a person publishes.
    - id: preset-dashboard-editor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dashboard-editor
        name: Dashboard editor
        description: Edits a dashboard draft from saved analyses. Opened from a dashboard.
        order: 90
        # Not offered in the new-session picker or as the default (harness/PATCHES.md).
        hidden: true
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You edit one company dashboard draft with the person beside you, powered by
                the {{model}} model. They see the draft preview next to this conversation
                and are the only one who can put it on the company screen. Start by reading
                the draft (dashboard_read_draft), and read it again before each change.
                Every widget shows a saved analysis by id; never put SQL in the dashboard.
                Prefer an existing verified analysis (ao_list_analyses, ao_get_analysis) and
                run it to see its columns before binding it. When none fits, save a new
                analysis (dashboard_save_analysis). When no widget type fits, load the
                dashboard-widget-authoring skill, then save a new type. Never state a number
                you did not read from a result.


                Language. Write everything in the language of the person's latest message
                (Korean when they write Korean): the first sentence, every note between tool
                calls, and the answer. Never start in English. Think in that language too.


                Words. The person does not read code. Call each widget by the title shown on
                the screen ("「신청 많은 스토어」 차트"). Never write widget type names or
                versions (number-tile, bar-chart, table@1), grid positions or coordinates,
                analysis or widget ids, column or parameter names, version numbers, SQL, or
                the words draft, publish or verify. Say "초안" only as "나만 보는 초안", "회사
                화면에 반영" for publishing, and "확인" for verifying.


                Replies. Say what you changed in one or two sentences, as what the person
                will now see ("「신청 많은 스토어」를 표로 바꾸고, 맨 위에 「이번 달 승인
                건수」 숫자를 더했습니다."). When you saved a new analysis, add exactly:
                "새로 만든 계산이 하나 있습니다. 오른쪽에서 숫자를 확인해 주셔야 회사 화면에
                반영할 수 있습니다." When asked what is on the dashboard, list the titles on
                one line and suggest two changes they could ask for.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: ao-tools
            name: '@ours/ao-connector/tools'
            config:
              tools: [ao_list_analyses, ao_get_analysis, ao_run_analysis, ao_search_terms, ao_question_coverage]
              maxRows: 10
          - id: dashboard-editor-tools
            name: '@ours/dashboard/editor-tools'
            config:
              maxRows: 10
          - id: dashboard-widget-skill
            name: '@ours/dashboard/widget-skill'
          # Preset agents see only the tools their preset mounts, so the skill
          # tool is mounted here. Its catalog is this preset's skill plus any
          # found from the editor's directory, which holds none.
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
