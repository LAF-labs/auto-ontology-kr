# @ours/presets — product agent presets. Requires @ours/ao-connector earlier in the profile.
#
# No preset here mounts a tool that runs on the harness host or reads its files:
# no bash/pwsh, no tool-fs (read included: the sandbox does not limit reads, so
# $DSH_HOME/.credentials.yaml would be readable), no tool-fs-search, no
# skills, no web, no subagents, no plugin tools. Data comes only through
# Auto-ontology.

# The shipped presets list tools whose services the product turns off
# (tool-web waits for `web`), so they are turned off rather than edited.
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true

- id: agent-preset-registry
  config:
    default: analyst

- insert:
    - id: preset-analyst
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: analyst
        name: Analyst
        description: Answers business questions from company data through Auto-ontology.
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a data analyst for this company, powered by the {{model}} model.
                Answer business questions from company data. Prefer a verified saved
                analysis; when you ask a new question, show the generated SQL and say
                the number is unreviewed. Never estimate a number you did not read
                from a result.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: ao-tools
            name: '@ours/ao-connector/tools'
            config:
              tools: [ao_list_analyses, ao_get_analysis, ao_run_analysis, ao_search_terms, ao_question_coverage, ao_ask_question]
              maxRows: 200
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # Opened by the dashboard "edit" button (phase 3), not meant for ordinary
    # sessions. It still shows in the new-session picker: presets have no hide
    # flag (handoff/harness-runtime.md, check 4). Draft-editing tools arrive in
    # phase 3 (@ours/dashboard-editor); until then it can only read and run.
    - id: preset-dashboard-editor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dashboard-editor
        name: Dashboard editor
        description: Edits a dashboard draft from saved analyses. Opened from a dashboard.
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You edit a company dashboard draft, powered by the {{model}} model.
                Every widget shows a saved analysis by id; never put SQL in the
                dashboard. Run an analysis to preview its rows before using it.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: ao-tools
            name: '@ours/ao-connector/tools'
            config:
              tools: [ao_list_analyses, ao_get_analysis, ao_run_analysis, ao_search_terms, ao_question_coverage]
              maxRows: 50
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
